name: Huldrych Zwingli - 1524 Grace Through Christ (Kokoro Review)
on:
  push:
    branches:
      - zwingli-1524-grace-kokoro-2026
    paths:
      - 'zwingli-kokoro/**'
      - '.github/workflows/zwingli-kokoro.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Zwingli narration branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg and free Kokoro ONNX voice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          python -m pip install kokoro-onnx soundfile numpy
      - name: Fetch public free Michael TTS model
        working-directory: zwingli-kokoro
        run: |
          curl -fL --retry 4 --retry-delay 10 --connect-timeout 40 \
            "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx" -o kokoro-v1.0.onnx
          curl -fL --retry 4 --retry-delay 10 --connect-timeout 40 \
            "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin" -o voices-v1.0.bin
          test "$(stat -c %s kokoro-v1.0.onnx)" -gt 300000000
          test "$(stat -c %s voices-v1.0.bin)" -gt 1000000
      - name: Render full Zwingli letter in Michael voice
        working-directory: zwingli-kokoro
        run: python -u render.py
      - name: Upload complete audio review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Zwingli-1524-Grace-Kokoro-REVIEW
          path: |
            zwingli-kokoro/output/*.mp3
            zwingli-kokoro/output/*.json
            zwingli-kokoro/output/narration_source.txt
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
