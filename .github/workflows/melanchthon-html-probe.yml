name: Melanchthon 1552 public reader completeness probe
on:
  push:
    branches:
      - melanchthon-1552-osiander-source-recovery-2026
    paths:
      - 'melanchthon-html-probe/**'
      - '.github/workflows/melanchthon-html-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check public book reader metadata and page images
        working-directory: melanchthon-html-probe
        run: python -u probe.py
      - name: Upload reader diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Melanchthon-1552-Public-Reader-Probe
          path: melanchthon-html-probe/probe/
          if-no-files-found: warn
          retention-days: 7
