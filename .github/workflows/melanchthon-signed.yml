name: Melanchthon 1552 signed scan retrieval
on:
  push:
    branches:
      - melanchthon-1552-osiander-source-recovery-2026
    paths:
      - 'melanchthon-signed/**'
      - '.github/workflows/melanchthon-signed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Recover through official signed Google Books PDF or EPUB links
        working-directory: melanchthon-signed
        run: python -u recover_signed.py
      - name: Upload source downloads and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Melanchthon-1552-Signed-Source-Check
          path: melanchthon-signed/source/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30
