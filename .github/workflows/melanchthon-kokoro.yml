name: Melanchthon 1552 Justification by Faith (Kokoro Michael Full Review)
on:
  push:
    branches:
      - melanchthon-1552-justification-kokoro-2026
    paths:
      - 'melanchthon-kokoro/**'
      - '.github/workflows/melanchthon-kokoro.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg and speech dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          python -m pip install --quiet kokoro-onnx soundfile numpy
      - name: Fetch free Kokoro model and Michael voice
        working-directory: melanchthon-kokoro
        run: |
          curl -fL --retry 4 --retry-delay 10 --connect-timeout 40 "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx" -o kokoro-v1.0.onnx
          curl -fL --retry 4 --retry-delay 10 --connect-timeout 40 "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin" -o voices-v1.0.bin
          test "$(stat -c %s kokoro-v1.0.onnx)" -gt 300000000
          test "$(stat -c %s voices-v1.0.bin)" -gt 1000000
      - name: Render complete translation with Michael voice
        working-directory: melanchthon-kokoro
        run: python -u render.py
      - name: Upload full audiobook and validation for video assembly
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Melanchthon-1552-Kokoro-Michael-Complete-REVIEW
          path: |
            melanchthon-kokoro/output/*.mp3
            melanchthon-kokoro/output/*.json
            melanchthon-kokoro/output/narration_source.txt
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
