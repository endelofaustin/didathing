name: Melanchthon historical German OCR pilot
on:
  push:
    branches:
      - melanchthon-1552-osiander-source-recovery-2026
    paths:
      - 'melanchthon-ocr-pilot/**'
      - '.github/workflows/melanchthon-ocr-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ocr-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install specialist historical print OCR
        run: |
          python -m pip install --quiet kraken
      - name: Fetch German historical type OCR model
        run: |
          curl -fL --retry 3 'https://zenodo.org/records/10519596/files/german_print.mlmodel?download=1' -o melanchthon-ocr-pilot/german_print.mlmodel
          test "$(stat -c %s melanchthon-ocr-pilot/german_print.mlmodel)" -gt 10000000
      - name: Transcribe samples of the 1552 German source
        run: python -u melanchthon-ocr-pilot/pilot.py
      - name: Upload OCR sample and images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Melanchthon-1552-Historical-OCR-Pilot
          path: |
            melanchthon-ocr-pilot/*.txt
            melanchthon-ocr-pilot/*.jpg
          if-no-files-found: warn
          retention-days: 30
