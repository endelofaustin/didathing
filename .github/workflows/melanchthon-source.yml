name: Melanchthon 1552 original-scan retrieval check
on:
  push:
    branches:
      - melanchthon-1552-osiander-source-recovery-2026
    paths:
      - 'melanchthon-source/**'
      - '.github/workflows/melanchthon-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-source:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF inspection tools
        run: sudo apt-get install -y poppler-utils
      - name: Retrieve and validate historical 1552 source editions
        working-directory: melanchthon-source
        run: python -u recover.py
      - name: Upload original scans if available and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Melanchthon-1552-Source-Retrieval-Check
          path: melanchthon-source/source_checks/
          if-no-files-found: warn
          retention-days: 30
