name: Benefit of Christ's Death - Complete Free Kokoro Audiobook
on:
  push:
    branches:
      - benefit-of-christs-death-kokoro-2026
    paths:
      - "benefit-kokoro/**"
      - ".github/workflows/benefit-kokoro.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out isolated audiobook branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free Kokoro and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          python -m pip install kokoro-onnx soundfile numpy
      - name: Download the same open neural TTS model used for Luther
        working-directory: benefit-kokoro
        run: |
          curl -fL --retry 4 --retry-delay 10 --connect-timeout 40 \
            "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx" \
            -o kokoro-v1.0.onnx
          curl -fL --retry 4 --retry-delay 10 --connect-timeout 40 \
            "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin" \
            -o voices-v1.0.bin
          test "$(stat -c %s kokoro-v1.0.onnx)" -gt 300000000
          test "$(stat -c %s voices-v1.0.bin)" -gt 1000000
      - name: Narrate the entire book and verify every chapter
        working-directory: benefit-kokoro
        env:
          BENEFIT_VOICE: am_michael
          BENEFIT_SPEED: '0.94'
        run: python -u render.py
      - name: Upload audiobook and validated chapter MP3s
        uses: actions/upload-artifact@v4
        with:
          name: Benefit-of-Christs-Death-Complete-Kokoro-Michael-Audiobook
          path: |
            benefit-kokoro/output/*.mp3
            benefit-kokoro/output/validation.json
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
