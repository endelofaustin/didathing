name: Endel archival register retrieval
on:
  push:
    branches: [research/endel-archive-20261121]
    paths: ['.github/workflows/endel-archive.yml']
  workflow_dispatch:
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Download La Petite-Pierre manuscript images near 1680
        shell: bash
        run: |
          mkdir -p archive-output
          cat > /tmp/get_images.py <<'PY'
          import urllib.request,urllib.error,json,os,re,time
          u="https://archives67.alsace.eu/ark:/78665/1989472/manifest"
          hdr={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36','Accept':'image/jpeg,image/*,application/json,*/*','Referer':'https://archives67.alsace.eu/ark:/78665/1989472'}
          def get(url,tag,timeout=22):
            try:
              req=urllib.request.Request(url,headers=hdr)
              try:r=urllib.request.urlopen(req,timeout=timeout)
              except urllib.error.HTTPError as e:r=e
              b=r.read(12000000)
              ct=r.headers.get('Content-Type','')
              print('GET',tag,r.status,ct,len(b),'jpeg=',b[:3]==b'\xff\xd8\xff','url=',r.geturl(),flush=True)
              if b[:3]==b'\xff\xd8\xff':
                with open('archive-output/'+tag+'.jpg','wb') as f:f.write(b)
                return True
              if b'%PDF' in b[:10]:
                with open('archive-output/'+tag+'.pdf','wb') as f:f.write(b)
                return True
              print('NONIMAGE',tag,re.sub(r'\s+',' ',b[:180].decode('utf8','replace')),flush=True)
              return False
            except Exception as e:
              print('ERROR',tag,repr(e),flush=True)
              return False
          with urllib.request.urlopen(urllib.request.Request(u,headers=hdr),timeout=45) as r: o=json.load(r)
          with open('archive-output/manifest-summary.json','w') as f:
            json.dump({'label':o.get('label'),'metadata':o.get('metadata'),'id':o.get('@id')},f,ensure_ascii=False,indent=2)
          canv=o['sequences'][0]['canvases']
          print('TOTAL',len(canv),flush=True)
          for idx in [71,72,73,74,75,76,77,78,34,35]:
            c=canv[idx]
            label=c.get('label')
            ren=c.get('rendering') or []
            ims=c.get('images') or []
            print('IMAGE',idx+1,label,'RENDERING',len(ren),'ANNOT',len(ims),flush=True)
            urls=[]
            if ren:
              r0=ren[0].get('@id','')
              if r0:urls.append(re.sub(r'HEI=\d+','HEI=2800',r0))
              if len(ren)>1:urls.append(ren[1].get('@id',''))
            if ims:
              x=ims[0].get('resource',{})
              url=x.get('@id')
              if url:urls.append(url)
              svc=x.get('service',{})
              sid=svc.get('@id') if isinstance(svc,dict) else None
              if sid:urls.append(sid+'/full/2400,/0/default.jpg')
            done=False
            for method,url in enumerate(urls[:4]):
              if not url:continue
              if get(url,'page_'+str(idx+1)+'_source_'+str(method)):
                done=True
                break
            if not done:print('FAILED_TO_DOWNLOAD_IMAGE',idx+1,flush=True)
          PY
          python /tmp/get_images.py 2>&1 | tee archive-output/runner-log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: endel-manuscript-images-1680
          path: archive-output/
          retention-days: 14
