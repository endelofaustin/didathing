name: Luther Galatians - Complete Free Kokoro Audio
on:
  push:
    branches:
      - luther-1545-free-voice-2026
    paths:
      - "galatians-free-render/**"
      - ".github/workflows/luther-galatians-free-audio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out isolated Luther narration branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline neural speech dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          python -m pip install kokoro-onnx soundfile numpy
      - name: Download free Kokoro speech model
        working-directory: galatians-free-render
        run: |
          curl -fL --retry 4 --retry-delay 10 --connect-timeout 40 \
            "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx" \
            -o kokoro-v1.0.onnx
          curl -fL --retry 4 --retry-delay 10 --connect-timeout 40 \
            "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin" \
            -o voices-v1.0.bin
          test "$(stat -c %s kokoro-v1.0.onnx)" -gt 300000000
          test "$(stat -c %s voices-v1.0.bin)" -gt 1000000
      - name: Render and validate the entire Galatians preface
        working-directory: galatians-free-render
        env:
          LUTHER_VOICE: am_michael
          LUTHER_SPEED: '0.94'
        run: python -u render.py
      - name: Upload complete single-file MP3 and verification manifest
        uses: actions/upload-artifact@v4
        with:
          name: Luther-Galatians-Complete-Kokoro-Narration
          path: |
            galatians-free-render/output/*.mp3
            galatians-free-render/output/validation.json
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
